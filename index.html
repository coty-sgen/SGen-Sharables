<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGen — Shareable Decks</title>
  <style>
    :root { --bg:#0b0d12; --card:#151922; --ink:#f5f7fa; --muted:#9aa4b2; --accent:#6ea8fe; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--ink); min-height: 100vh;
      padding: 48px 20px;
    }
    .wrap { max-width: 760px; margin: 0 auto; }
    header { margin-bottom: 40px; }
    h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.5px; }
    .sub { color: var(--muted); font-size: 15px; margin: 0; }
    .grid { display: grid; gap: 14px; }
    a.card {
      display: block; text-decoration: none; color: inherit;
      background: var(--card); border: 1px solid #232a36; border-radius: 12px;
      padding: 20px 22px; transition: border-color .15s, transform .15s;
    }
    a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card .title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .card .desc { color: var(--muted); font-size: 14px; }
    .card .go { color: var(--accent); font-size: 13px; margin-top: 10px; }
    footer { color: var(--muted); font-size: 13px; margin-top: 48px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>SGen — Shareable Decks</h1>
      <p class="sub">Pitch decks and presentations, ready to view in any browser.</p>
    </header>

    <div class="grid">
      <!-- To add a new deck: copy one of these blocks, change the link, title, and description. -->
      <a class="card" href="flyy-tyme.html">
        <div class="title">FLYY TYME × SGen</div>
        <div class="desc">Partnership pitch deck.</div>
        <div class="go">Open deck →</div>
      </a>

      <a class="card" href="flyy-tyme-sales-pitch.html">
        <div class="title">FLYY TYME — Sales Pitch</div>
        <div class="desc">Sales-focused pitch deck.</div>
        <div class="go">Open deck →</div>
      </a>
    </div>

    <footer>SGen · Powered by GitHub Pages</footer>
  </div>
</body>
</html>
